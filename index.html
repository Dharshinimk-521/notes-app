<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Notes App</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">   
        <script src="app.js" defer></script> 
    </head>
    <body>
    <div class="app">
        
        <aside class="sidebar">
        <button id="newPageBtn">+ New Page</button>
        <ul id="pageList"></ul>
        <button id="deletePageBtn"> Delete Page</button>
        </aside>
         
        <main class="editor">
            <div class="intro">
                <img id="logo" src="logo-icon.jpg" alt="notes-logo">
                <h1 class="title">Notes App:</h1>
                <br>
                <p id="desc">A platform that can u used to take notes of different events with the ability to store and update them.</p>
            </div>
            <input id="pageTitle" placeholder="Untitled..." />

            <div class="editor-container">
                <div id="editorArea" contenteditable="true"></div>
                <div class="font-selector">
                <select id="fontSelect" onchange="changeFont(this.value)">
                    <option value="default">Default (Montserrat)</option>
                    <option value="sans">Sans-serif</option>
                    <option value="mono">Monospace</option>
                </select>
                </div>
                <div class="tool-bar">
                    <button onclick="formatText('bold')"><b>B</b></button>
                    <button onclick="formatText('italic')"><i>I</i></button>
                    <button onclick="changeFontSize(1)">A+</button>
                    <button onclick="changeFontSize(-1)">A-</button>
                    <button onclick="document.getElementById('imageInput').click()">
                        📎 Image
                    </button>

                    <input type="file" id="imageInput" accept="image/*" hidden />
                </div>

                
                

            </div>
        </main>

    </div>

    
    </body>
</html>
